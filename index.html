<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Tracker</title>
    <link rel="icon" type="image/svg+xml" href="./src-tauri/icons/icon-small.svg" />
    <!--
      Linked rather than imported from main.ts on purpose: a JS `import` of CSS
      injects a <style> tag in dev, which the app's `style-src 'self'` CSP
      blocks. That failure only appears in the desktop webview, never in
      `npm run dev` in a browser.
    -->
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!--
      The window is transparent and frameless; this card is the only thing that
      paints. It slides in from the LEFT edge — the bottom-right corner belongs
      to noticeable-calendar-alert, and two utilities fighting over one corner is
      how you end up ignoring both.
    -->
    <main id="card" class="card" aria-live="polite">
      <header class="card-head">
        <img class="brand" src="./src-tauri/icons/icon-small.svg" alt="" aria-hidden="true" />
        <div class="head-text">
          <h1 id="headline" class="headline">Quick check-in</h1>
          <p id="subhead" class="subhead"></p>
        </div>
        <button
          id="team-open"
          class="icon-button is-glyph"
          type="button"
          title="Team"
          aria-label="Team"
        >
          👥
        </button>
        <button
          id="settings-open"
          class="icon-button is-glyph"
          type="button"
          title="Settings"
          aria-label="Settings"
        >
          ⚙
        </button>
        <button id="snooze" class="icon-button" type="button" title="Snooze (Esc)">Snooze</button>
      </header>

      <section class="tasks" aria-labelledby="tasks-label">
        <h2 id="tasks-label" class="section-label">Tasks</h2>
        <ul id="task-list" class="task-list"></ul>
        <p id="empty-state" class="empty-state" hidden>Nothing yet — add your first task below.</p>
      </section>

      <form id="task-form" class="entry" autocomplete="off">
        <input
          id="task-input"
          class="entry-input"
          type="text"
          placeholder="Add a task…"
          aria-label="Add a task"
          maxlength="200"
        />
        <button class="entry-button" type="submit" title="Add task">Add</button>
      </form>

      <form id="note-form" class="entry" autocomplete="off">
        <input
          id="note-input"
          class="entry-input"
          type="text"
          placeholder="Note a thought… @alice #kudos"
          aria-label="Add a note"
          maxlength="500"
        />
        <button class="entry-button" type="submit" title="Add note">Note</button>
      </form>

      <!--
        Only shown at day-end, and only with manager mode on — this is the
        one place the recurring check-in grows an extra step. It writes to
        whoever is `@mentioned`, auto-creating their team file if this is the
        first time.
      -->
      <form id="team-day-end-form" class="entry" autocomplete="off" hidden>
        <input
          id="team-day-end-input"
          class="entry-input"
          type="text"
          placeholder="Anything on your reports? @alice shipped the migration"
          aria-label="Log a note about a report"
          maxlength="500"
        />
        <button class="entry-button" type="submit" title="Log">Log</button>
      </form>

      <footer class="card-foot">
        <button id="done" class="primary-button" type="button">Done</button>
        <button
          id="copy-standup"
          class="ghost-button"
          type="button"
          title="Yesterday, today and blockers — for standup"
        >
          Standup
        </button>
        <!--
          The vault is already agent-readable, so this is not for someone who has
          the folder. It carries its own schema key so it stands alone when
          pasted into a chat with an agent that can't see the files.
        -->
        <button
          id="copy-week"
          class="ghost-button"
          type="button"
          title="This week, framed for an agent"
        >
          Week
        </button>
        <button
          id="card-expand"
          class="icon-button is-glyph"
          type="button"
          title="Expand"
          aria-label="Expand"
          aria-pressed="false"
        >
          ⤢
        </button>
        <span id="status" class="status" role="status"></span>
      </footer>
    </main>

    <!--
      Settings, as an overlay rather than a second window: a new Tauri window
      would need its own capability set, its own positioning against the same
      top-left corner, and would show in the taskbar this app deliberately skips.
      It is a sibling of the card, not a child, so opening it from the tray with
      no check-in due paints the panel alone against the transparent window.
    -->
    <aside
      id="settings"
      class="settings"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settings-title"
      hidden
    >
      <header class="settings-head">
        <h2 id="settings-title" class="settings-title">Settings</h2>
        <button
          id="settings-expand"
          class="icon-button is-glyph"
          type="button"
          title="Expand"
          aria-label="Expand"
          aria-pressed="false"
        >
          ⤢
        </button>
        <button id="settings-close" class="icon-button" type="button" title="Close (Esc)">
          Close
        </button>
      </header>

      <div class="settings-body">
        <div class="field">
          <span class="field-label">Work day</span>
          <div class="field-row">
            <input
              id="work-start"
              class="entry-input time-input"
              type="time"
              aria-label="Work day starts at"
            />
            <span class="field-joiner">to</span>
            <input
              id="work-end"
              class="entry-input time-input"
              type="time"
              aria-label="Work day ends at"
            />
          </div>
        </div>

        <div class="field">
          <span class="field-label">Working days</span>
          <!-- Buttons are generated from DAY_LABELS so the two can't drift. -->
          <div id="work-days" class="day-toggles" role="group" aria-label="Working days"></div>
        </div>

        <div class="field">
          <label class="check">
            <input id="hourly-enabled" type="checkbox" />
            <span>Nudge me every hour</span>
          </label>
          <p class="field-hint">The day's opener and wrap-up always run.</p>
        </div>

        <!--
          The one field whose label reads as a sentence with its control, so it
          shares the row instead of taking a section heading of its own. That
          also buys back the ~19px of height that pushed the panel into a
          scrollbar on platforms whose native time inputs are taller than
          Chromium's.
        -->
        <div class="field">
          <div class="field-row">
            <label class="field-joiner" for="snooze-minutes">Snooze for</label>
            <input
              id="snooze-minutes"
              class="entry-input number-input"
              type="number"
              min="1"
              max="60"
              step="1"
              inputmode="numeric"
            />
            <span class="field-joiner">minutes</span>
          </div>
        </div>

        <div class="field">
          <label class="check">
            <input id="launch-at-login" type="checkbox" />
            <span>Start Task Tracker at login</span>
          </label>
        </div>

        <div class="field">
          <label class="check">
            <input id="manager-mode-enabled" type="checkbox" />
            <span>I manage people — add a day-end step for reports</span>
          </label>
        </div>

        <div class="field">
          <span class="field-label">Vault folder</span>
          <div class="field-row vault-row">
            <p id="vault-path" class="vault-path"></p>
            <button id="open-vault" class="ghost-button" type="button">Open</button>
          </div>
        </div>
      </div>

      <footer class="settings-foot">
        <button id="settings-save" class="primary-button" type="button">Save</button>
        <button id="settings-cancel" class="ghost-button" type="button">Cancel</button>
        <p id="settings-error" class="settings-error" role="alert"></p>
      </footer>
    </aside>

    <!--
      The Team panel: a sibling overlay, same shell as Settings, always
      reachable from the tray or the card header regardless of manager mode.
      There is no roster — typing a handle and pressing Open loads that
      report's file, creating an empty one the first time.
    -->
    <aside
      id="team"
      class="settings"
      role="dialog"
      aria-modal="true"
      aria-labelledby="team-title"
      hidden
    >
      <header class="settings-head">
        <h2 id="team-title" class="settings-title">Team</h2>
        <button
          id="team-expand"
          class="icon-button is-glyph"
          type="button"
          title="Expand"
          aria-label="Expand"
          aria-pressed="false"
        >
          ⤢
        </button>
        <button id="team-close" class="icon-button" type="button" title="Close (Esc)">Close</button>
      </header>

      <div class="settings-body">
        <div class="field">
          <span class="field-label">Report</span>
          <div class="field-row">
            <input
              id="team-person-input"
              class="entry-input"
              type="text"
              list="team-people-list"
              placeholder="@handle"
              aria-label="Report's handle"
              maxlength="40"
            />
            <button id="team-person-load" class="ghost-button" type="button">Open</button>
          </div>
          <datalist id="team-people-list"></datalist>
          <p id="team-person-error" class="settings-error" role="alert"></p>
        </div>

        <section class="tasks" aria-labelledby="team-tasks-label">
          <h2 id="team-tasks-label" class="section-label">What they're working on</h2>
          <ul id="team-task-list" class="task-list"></ul>
          <p id="team-empty-state" class="empty-state" hidden>Nothing tracked yet.</p>
        </section>

        <form id="team-task-form" class="entry" autocomplete="off">
          <input
            id="team-task-input"
            class="entry-input"
            type="text"
            placeholder="Add what they're working on…"
            aria-label="Add a task for this report"
            maxlength="200"
          />
          <button class="entry-button" type="submit" title="Add task">Add</button>
        </form>

        <form id="team-note-form" class="entry" autocomplete="off">
          <input
            id="team-note-input"
            class="entry-input"
            type="text"
            placeholder="Note a thought… #kudos"
            aria-label="Add a note about this report"
            maxlength="500"
          />
          <button class="entry-button" type="submit" title="Add note">Note</button>
        </form>

        <div class="field">
          <span class="field-label">Recent notes</span>
          <ul id="team-notes" class="team-notes"></ul>
        </div>
      </div>

      <footer class="settings-foot">
        <button
          id="team-copy-week"
          class="ghost-button"
          type="button"
          title="This week across every tracked report, framed for an agent"
        >
          Copy team week
        </button>
        <span id="team-status" class="status" role="status"></span>
      </footer>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
