name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/setup@v2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      # A green lint/test run does not prove the app bundles.
      - name: Build
        run: pnpm run build

  # Drive the real app in a browser. The unit job proves the logic is right; this
  # proves the app actually runs — that the controller finds its elements, that
  # clicks reach the model, and that a finished check-in lands on disk as valid
  # Markdown. A blank-window regression passes every other job in this file.
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/setup@v2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm run e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # The capture specs regenerate these; publishing them on every run makes a
      # visual regression reviewable without checking the branch out.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: docs/screenshots/
          retention-days: 7

  # Compile the Tauri/Rust backend. Without this, a Rust bug would ship
  # undetected — the quality job above only exercises the web layer.
  rust:
    name: Rust compile check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            pkg-config

      - name: Set up pnpm
        uses: pnpm/setup@v2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # generate_context! embeds the built frontend and icons at compile time,
      # so the frontend must exist before cargo runs.
      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `--locked` because Cargo.lock is committed: CI must fail on an
      # out-of-date lockfile rather than silently resolving newer versions.
      - name: cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
